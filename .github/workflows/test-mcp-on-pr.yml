name: Test MCP on PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-mcp-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: MCP checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:worker
